<!-- Navigation -->
<style>
  /* Base/Desktop styles */
  .brand-title {
    font-size: 40px;
    color: #000;
    font-family: 'Inknut Antiqua', serif;
    background-color: transparent;
    position: absolute;
    bottom: 0px;
    margin: 0;
  }

  .menu-toggler {
    border: none;
    position: absolute;
    bottom: 0px;
    right: 20px;
    background-color: transparent !important;
  }

  .menu-toggler img {
    width: 80px;
  }

  .navbar-nav-custom {
    margin-right: 1em;
    position: absolute;
    bottom: 5px;
    right: 100px;
    font-family: 'Open Sans', sans-serif;
    color: black;
    background-color: transparent;
  }

  /* Mobile specific fixes */
  @media (max-width: 767px) {
    .navbar-header.page-scroll {
      min-height: 70px;
      /* Provide space for absolute elements */
    }

    .brand-title {
      font-size: 24px;
      /* Scaled down to prevent overlap */
      bottom: 15px;
      left: 15px;
    }

    .menu-toggler {
      right: 5px;
      bottom: 10px;
      padding: 0;
    }

    .menu-toggler img {
      width: 45px;
      /* Scaled down hamburger icon */
    }

    .navbar-nav-custom {
      position: relative;
      /* Allows menu to flow vertically when expanded */
      bottom: auto;
      right: auto;
      background-color: rgba(255, 255, 255, 0.95);
      /* Solid backing to prevent text overlap with page */
      margin: 0;
      padding: 10px 0;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 100%;
      text-align: left;
    }

    .navbar-nav-custom li {
      width: 100%;
    }

    .navbar-nav-custom>li>a {
      padding: 10px 20px;
      display: block;
    }
  }
</style>

<nav class="navbar navbar-default"
  style="margin-right:1em; z-index: 100; border: none; background: transparent; position: absolute; left: 0; top: 0; width: 100%;">
  <div class="container-fluid" style='background-color: transparent;'>
    <!-- Brand and toggle get grouped for better mobile display -->
    <div class="navbar-header page-scroll" style='background-color: transparent;'>
      <button type="button" class="navbar-toggle menu-toggler" data-toggle="collapse"
        data-target="#bs-example-navbar-collapse-1" aria-expanded="false">
        <img src="{{site.baseurl}}/img/bars.png" alt="Menu">
      </button>
      <h1 class="brand-title">Gaoyue Zhou</h1>
    </div>

    <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
      <ul class="nav navbar-nav navbar-right navbar-nav-custom">
        {% for nav_hash in site.nav %}
        {% for nav_item in nav_hash %}
        {% assign lowercase_nav_item = nav_item[0] | downcase %}
        {% if page.active == lowercase_nav_item %}
        <li class="active"><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
        {% else %}
        <li><a href="{{ nav_item[1] }}">{{ nav_item[0] }}</a></li>
        {% endif %}
        {% endfor %}
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>

<script>
  // Close the mobile menu when clicking outside the expanded menu
  document.addEventListener('click', function (event) {
    var navbarCollapse = document.getElementById('bs-example-navbar-collapse-1');
    var isClickInsideMenu = event.target.closest('#bs-example-navbar-collapse-1');
    var isClickOnToggle = event.target.closest('.navbar-toggle');

    if (navbarCollapse && navbarCollapse.classList.contains('in') && !isClickInsideMenu && !isClickOnToggle) {
      document.querySelector('.navbar-toggle').click();
    }
  });
</script>
